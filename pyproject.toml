[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avclass-label"
version = "0.1.0"
description = "CLI tool to label malware families from VirusTotal reports using AVClass"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PO-LIN LAI" },
]
keywords = ["malware", "avclass", "virustotal", "labeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "tqdm",
    "avclass-malicialab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
avclass-label = "avclass_label.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avclass_label"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["avclass_label"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
